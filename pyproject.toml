[project]
name = "eventflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.98",
    "pydantic>=2.13.5",
]

[project.scripts]
eventflow = "eventflow:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a deployed EventFlow stack",
]
